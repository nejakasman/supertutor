
name: SuperTutor CI/CD

on:
  push:
    branches:
      - main
      - feature/ci-cd-pipeline
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Preverjanje kode
    runs-on: ubuntu-latest

    steps:
      - name: Prenos kode
        uses: actions/checkout@v4

      - name: Nastavitev Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Namestitev odvisnosti
        working-directory: backend
        run: npm ci

      - name: ESLint
        working-directory: backend
        run: npm run lint

  build:
    name: Gradnja aplikacije
    runs-on: ubuntu-latest

    steps:
      - name: Prenos kode
        uses: actions/checkout@v4

      - name: Nastavitev Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Namestitev odvisnosti
        working-directory: backend
        run: npm ci

      - name: Preverjanje gradnje
        working-directory: backend
        run: npm run build

      - name: Shranjevanje build artefakta
        uses: actions/upload-artifact@v4
        with:
          name: supertutor-build
          path: |
            backend/app.js
            backend/models/
            backend/routes/
            backend/views/
            backend/scripts/
            backend/package.json
            backend/package-lock.json
          if-no-files-found: error

  test:
    name: Testiranje in pokritost kode
    needs: [lint, build]
    runs-on: ubuntu-latest

    steps:
      - name: Prenos kode
        uses: actions/checkout@v4

      - name: Nastavitev Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Namestitev odvisnosti
        working-directory: backend
        run: npm ci

      - name: Izvajanje testov
        working-directory: backend
        run: npm run test:coverage

      - name: Shranjevanje poročila o pokritosti
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supertutor-coverage
          path: backend/coverage/
          if-no-files-found: warn
